name: Kompilacja Pracy Magisterskiej (PDF)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Kompilacja LaTeX do PDF
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Kompilacja dokumentu w środowisku TeX Live
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: |
            pdflatex -file-line-error -interaction=nonstopmode EE-dyplom || true
            biber EE-dyplom || true
            makeglossaries EE-dyplom || true
            pdflatex -file-line-error -interaction=nonstopmode EE-dyplom || true
            pdflatex -file-line-error -interaction=nonstopmode EE-dyplom

      - name: Publikacja gotowego pliku PDF jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: Praca-Magisterska-Rafal-Kaczynski-342208
          path: EE-dyplom.pdf
          if-no-files-found: error
